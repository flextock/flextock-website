# Shared App Hosting defaults for all environments.
# Environment-specific overrides: apphosting.staging.yaml, apphosting.production.yaml
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 80
  maxInstances: 10
  minInstances: 0

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
