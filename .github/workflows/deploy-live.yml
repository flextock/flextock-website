name: Deploy live

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  build:
    name: Live → Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/452714871232/locations/global/workloadIdentityPools/github-deployment/providers/github"
          service_account: "flextock-project-deployments@cosmic-tenure-290110.iam.gserviceaccount.com"

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@13 deploy --only hosting:flextock-website --project cosmic-tenure-290110 --non-interactive
