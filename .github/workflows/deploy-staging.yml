name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build:
    name: Staging → Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/695078373719/locations/global/workloadIdentityPools/github-cloudrun-deploy/providers/github"
          service_account: "github-deploy-gcloud-workflow@flexdevelopment.iam.gserviceaccount.com"

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@13 deploy --only hosting:flextock-website-stg --project flexdevelopment --non-interactive
