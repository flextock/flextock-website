name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging → flextockdevelopment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_DEV" ]; then
            echo "::error::Missing secret FIREBASE_SERVICE_ACCOUNT_DEV (JSON key for project flextockdevelopment)."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_DEV" > "${RUNNER_TEMP}/firebase-sa.json"

      - name: Deploy App Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          set -euo pipefail
          echo "Deploying backend flextock-website-stg to project flextockdevelopment..."
          npx firebase-tools@14.27.0 deploy \
            --only apphosting:flextock-website-stg \
            --project flextockdevelopment \
            --non-interactive \
            --force | tee "${RUNNER_TEMP}/firebase-deploy.log"
          if grep -Eiq 'skipping|no apphosting|nothing to deploy' "${RUNNER_TEMP}/firebase-deploy.log"; then
            echo "::error::Firebase reported a skipped/empty App Hosting deploy. Check backend id flextock-website-stg exists in flextockdevelopment."
            exit 1
          fi
          if ! grep -Eiq 'apphosting|Deploy complete|uploaded|rollout' "${RUNNER_TEMP}/firebase-deploy.log"; then
            echo "::error::Deploy finished without App Hosting confirmation in the logs."
            exit 1
          fi
          echo "Deploy step finished."
