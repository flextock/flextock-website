# Production / Firebase LIVE — live branch: master
# Set backend Environment name to "production" in the Firebase console.

runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 80
  maxInstances: 20
  minInstances: 1

env:
  - variable: NEXT_PUBLIC_SITE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME
